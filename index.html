<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINI-TIENDA POS</title>
    <!-- Conecta con tu archivo manifest.json -->
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f1f5f9; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- Este iframe carga tu tienda real desde Google a pantalla completa -->
    <iframe src="https://script.google.com/macros/s/AKfycbxgpaeWKWu_ZDNZR4zeqKe-lKLneiL6y108ZLV-iSaGksm84yO9OspeTk8ucYg4hIlXUQ/exec" allow="camera; microphone; fullscreen"></iframe>

    <script>
        // Esto es lo que exige PWABuilder para aprobar la aplicación
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker registrado correctamente'))
            .catch(err => console.error('Error en Service Worker', err));
        }
    </script>
</body>
</html>
